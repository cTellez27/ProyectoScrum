<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/header :: head(title='Registro de Tarjetas')}"></head>

<body>
    <div th:replace="~{fragments/header :: sidebar}"></div>
    <div th:replace="~{fragments/boton-volver :: back(url=@{/partidos/torneo/{id}(id=${partido.idTorneo})})}"></div>

    <div class="container">
        <div class="main-card" style="max-width: 1000px;">

            <div class="bg-warning text-dark d-flex justify-content-between align-items-center p-3" style="border-radius: 1rem 1rem 0 0;">
                <h1 class="h4 mb-0"><i class="bi bi-person-vcard me-2"></i> Registrar Tarjetas</h1>
            </div>

            <div class="p-4 text-center">
                <h2 class="h3" th:text="${partido.equipoLocalNombre} + ' vs ' + ${partido.equipoVisitanteNombre}"></h2>
                <h5 class="text-muted" th:text="${partido.torneoNombre}"></h5>
            </div>

            <div th:if="${mensajeExito}" class="alert alert-success mx-4" role="alert" th:text="${mensajeExito}"></div>
            <div th:if="${mensajeError}" class="alert alert-danger mx-4" role="alert" th:text="${mensajeError}"></div>

            <div class="p-4 border-bottom border-secondary">
                <h3 class="h5 text-white mb-3">Selecciona el jugador</h3>

                <div class="row g-4">
                    <div class="col-lg-6">
                        <h4 class="h6 text-warning mb-2" th:text="${partido.equipoLocalNombre}"></h4>
                        <div class="table-responsive">
                            <table class="table table-sm table-striped table-hover align-middle mb-0">
                                <thead class="table-dark">
                                    <tr>
                                        <th>Jugador</th>
                                        <th>Posición</th>
                                        <th class="text-end">Acción</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="jugador : ${jugadoresLocal}">
                                        <td th:text="${jugador.nombre}"></td>
                                        <td th:text="${jugador.posicion}"></td>
                                        <td class="text-end">
                                            <button type="button" class="btn btn-warning btn-sm text-dark fw-bold"
                                                    data-bs-toggle="modal"
                                                    th:data-bs-target="'#modalTarjeta-' + ${partido.id} + '-' + ${jugador.id}">
                                                <i class="bi bi-card-text"></i> Tarjeta
                                            </button>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div class="col-lg-6">
                        <h4 class="h6 text-warning mb-2" th:text="${partido.equipoVisitanteNombre}"></h4>
                        <div class="table-responsive">
                            <table class="table table-sm table-striped table-hover align-middle mb-0">
                                <thead class="table-dark">
                                    <tr>
                                        <th>Jugador</th>
                                        <th>Posición</th>
                                        <th class="text-end">Acción</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="jugador : ${jugadoresVisitante}">
                                        <td th:text="${jugador.nombre}"></td>
                                        <td th:text="${jugador.posicion}"></td>
                                        <td class="text-end">
                                            <button type="button" class="btn btn-warning btn-sm text-dark fw-bold"
                                                    data-bs-toggle="modal"
                                                    th:data-bs-target="'#modalTarjeta-' + ${partido.id} + '-' + ${jugador.id}">
                                                <i class="bi bi-card-text"></i> Tarjeta
                                            </button>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <div class="p-4">
                <h3 class="h5 text-white">Tarjetas Registradas en este Partido</h3>
                <div class="table-responsive">
                    <table class="table table-sm table-striped table-hover align-middle mb-0">
                        <thead>
                            <tr>
                                <th>Jugador</th>
                                <th>Tipo</th>
                                <th>Minuto</th>
                                <th class="text-end">Quitar</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${tarjetasRegistradas.isEmpty()}">
                                <td colspan="4" class="text-center p-3">Sin incidentes.</td>
                            </tr>
                            <tr th:each="tarjeta : ${tarjetasRegistradas}">
                                <td th:text="${tarjeta.nombreJugador}"></td>
                                <td>
                                    <span th:if="${tarjeta.tipoTarjeta == 'AMARILLA'}" class="badge bg-warning text-dark">Amarilla</span>
                                    <span th:if="${tarjeta.tipoTarjeta == 'ROJA'}" class="badge bg-danger">Roja</span>
                                </td>
                                <td th:text="${tarjeta.minutoJuego} + ' min'"></td>
                                <td class="text-end">
                                    <a th:href="@{/partidos/tarjetas/eliminar/{idTarjeta}(idTarjeta=${tarjeta.id})}"
                                       class="btn btn-outline-danger btn-sm"
                                       onclick="return confirm('¿Quitar este registro de tarjeta?');">
                                        <i class="bi bi-x-circle"></i>
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <!-- Modales para equipo local -->
    <div th:each="jugador : ${jugadoresLocal}">
        <div class="modal fade" th:id="'modalTarjeta-' + ${partido.id} + '-' + ${jugador.id}" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content text-dark">
                    <form th:action="@{/partidos/{idPartido}/tarjetas/registrar(idPartido=${partido.id})}" method="post">
                        <input type="hidden" name="idJugador" th:value="${jugador.id}" />
                        <div class="modal-header">
                            <h5 class="modal-title">Registrar tarjeta para <span th:text="${jugador.nombre}"></span></h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            <div class="mb-3">
                                <label class="form-label fw-bold">Tipo de tarjeta</label>
                                <select class="form-select" name="tipoTarjeta" required>
                                    <option value="">-- Seleccione --</option>
                                    <option value="AMARILLA">Amarilla</option>
                                    <option value="ROJA">Roja</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Minuto de juego</label>
                                <input type="number" class="form-control" name="minutoJuego" min="0" max="120" placeholder="Ej. 43" />
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                            <button type="submit" class="btn btn-warning text-dark fw-bold">Guardar tarjeta</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Modales para equipo visitante -->
    <div th:each="jugador : ${jugadoresVisitante}">
        <div class="modal fade" th:id="'modalTarjeta-' + ${partido.id} + '-' + ${jugador.id}" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content text-dark">
                    <form th:action="@{/partidos/{idPartido}/tarjetas/registrar(idPartido=${partido.id})}" method="post">
                        <input type="hidden" name="idJugador" th:value="${jugador.id}" />
                        <div class="modal-header">
                            <h5 class="modal-title">Registrar tarjeta para <span th:text="${jugador.nombre}"></span></h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            <div class="mb-3">
                                <label class="form-label fw-bold">Tipo de tarjeta</label>
                                <select class="form-select" name="tipoTarjeta" required>
                                    <option value="">-- Seleccione --</option>
                                    <option value="AMARILLA">Amarilla</option>
                                    <option value="ROJA">Roja</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Minuto de juego</label>
                                <input type="number" class="form-control" name="minutoJuego" min="0" max="120" placeholder="Ej. 43" />
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                            <button type="submit" class="btn btn-warning text-dark fw-bold">Guardar tarjeta</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <th:block th:replace="~{fragments/header :: scripts}"></th:block>
</body>
</html>
