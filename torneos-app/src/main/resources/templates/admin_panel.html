<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head(title='Panel de Administración')}"></head>

<body>
    <div th:replace="~{fragments/boton-volver :: back(url=@{/index})}"></div>

    <div class="container">
        <div class="main-card" style="max-width: 1100px;">
            
            <div class="bg-primary-header d-flex justify-content-between align-items-center p-3">
                <h1 class="h4 mb-0 text-white"><i class="bi bi-sliders me-2"></i> Panel de Administración</h1>
            </div>

            <div th:if="${exito}" class="alert alert-success m-3" role="alert" th:text="${exito}"></div>
            <div th:if="${error}" class="alert alert-danger m-3" role="alert" th:text="${error}"></div>

            <div class="p-4">
                <!-- Sección 1: Solicitudes Pendientes -->
                <div class="card bg-dark border-secondary mb-4 shadow-sm">
                    <div class="card-header bg-secondary text-white fw-bold">
                        <i class="bi bi-person-check-fill me-2"></i> Organizadores Pendientes de Aprobación
                    </div>
                    <div class="card-body">
                        <div th:if="${#lists.isEmpty(pendientes)}" class="text-center text-muted py-3">
                            No hay solicitudes pendientes de aprobación.
                        </div>

                        <div th:if="${not #lists.isEmpty(pendientes)}" class="table-responsive">
                            <table class="table table-dark table-hover align-middle mb-0">
                                <thead class="table-primary">
                                    <tr>
                                        <th>Nombre</th>
                                        <th>Correo</th>
                                        <th class="text-end">Acción</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="user : ${pendientes}">
                                        <td th:text="${user.nombreUsuario}" class="fw-bold">Nombre</td>
                                        <td th:text="${user.correoUsuario}">Correo</td>
                                        <td class="text-end">
                                            <form th:action="@{/admin/aprobar/{id}(id=${user.id})}" method="post" class="d-inline">
                                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                                <button type="submit" class="btn btn-success btn-sm fw-bold">
                                                    <i class="bi bi-check-circle-fill me-1"></i> Aprobar
                                                </button>
                                            </form>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- Sección 2: Asignar Torneo -->
                <div class="card bg-dark border-secondary shadow-sm">
                    <div class="card-header bg-secondary text-white fw-bold">
                        <i class="bi bi-trophy-fill me-2"></i> Asignar Organizador a Torneo
                    </div>
                    <div class="card-body">
                        <p class="text-muted small mb-4">
                            <i>Nota: Solo se puede asignar a un organizador que no tenga torneos activos actualmente.</i>
                        </p>

                        <form th:action="@{/admin/asignar}" method="post" class="row g-3">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                            <div class="col-md-6">
                                <label for="usuarioId" class="form-label text-white fw-bold">1. Selecciona Organizador (Aprobado):</label>
                                <select id="usuarioId" name="usuarioId" class="form-select form-select-dark" required>
                                    <option value="" disabled selected>-- Elige un organizador --</option>
                                    <option th:each="org : ${organizadores}" 
                                            th:value="${org.id}" 
                                            th:text="${org.nombreUsuario} + ' (' + ${org.correoUsuario} + ')'">
                                    </option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label for="torneoId" class="form-label text-white fw-bold">2. Selecciona el Torneo:</label>
                                <select id="torneoId" name="torneoId" class="form-select form-select-dark" required>
                                    <option value="" disabled selected>-- Elige un torneo --</option>
                                    <option th:each="t : ${torneos}" 
                                            th:value="${t.id}" 
                                            th:text="${t.nombre} + ' (Actual: ' + (${t.creadoPorNombre != null} ? ${t.creadoPorNombre} : 'Nadie') + ')'">
                                    </option>
                                </select>
                            </div>

                            <div class="col-12 text-end mt-4">
                                <button type="submit" class="btn btn-primary fw-bold">
                                    <i class="bi bi-person-plus-fill me-1"></i> Asignar Torneo
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <th:block th:replace="~{fragments/header :: scripts}"></th:block>
</body>
</html>
