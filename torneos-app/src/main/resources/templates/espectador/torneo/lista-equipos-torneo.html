<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/header :: head(title='Equipos: ' + ${torneoNombre})}"></head>

<body>
	<div th:replace="~{fragments/boton-volver :: back(url=@{/torneos})}"></div>
	
    <div class="container">
        <div class="main-card" style="max-width: 1200px;">

            <div class="bg-success-header d-flex justify-content-between align-items-center p-3">
                <h1 class="text-white mb-4">
                    Equipos Inscritos en el torneo: <span th:text="${torneoNombre}">[Nombre del Torneo]</span>
                </h1>
            </div>
            
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle">
                    <thead class="table-success">
                        <tr>
                            <th>Nombre</th>
                            <th>Director Técnico</th>
                            <th>Ciudad de Origen</th>
                            <th class="text-end">Ver Jugadores</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${equipos.isEmpty()}">
                            <td colspan="4" class="text-center">No hay equipos inscritos en este torneo.</td>
                        </tr>
                        
                        <tr th:each="equipo : ${equipos}">
                            
                            <td th:text="${equipo.nombre}">Nombre del Equipo</td>
                            <td th:text="${equipo.directorTecnico}">DT Nombre</td>
                            <td th:text="${equipo.ciudadOrigen}">Ciudad Origen</td>
                            
                            <td class="text-end">
                                <a th:href="@{/equipos/{idEquipo}/jugadores(idEquipo=${equipo.id})}" class="btn btn-warning btn-sm me-2 text-dark">
                                    <i class="bi bi-people-fill"></i> Jugadores
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <th:block th:replace="~{fragments/header :: scripts}"></th:block>
</body>
</html>
