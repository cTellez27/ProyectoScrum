<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
	
<head th:replace="~{fragments/header :: head(title='Consulta de Torneos')}"></head>

<body>
    <div th:replace="~{fragments/boton-volver :: back(url=@{/espectador})}"></div>
    
    <div class="container">
        <div class="main-card" style="max-width: 1200px;">
            
            <div class="bg-success-header d-flex justify-content-between align-items-center p-3">
                <h1 class="h4 mb-0 text-white"><i class="bi bi-trophy-fill me-2"></i> Consulta de Torneos</h1>
            </div>
            
            <div th:if="${mensajeExito}" class="alert alert-success m-3" role="alert" th:text="${mensajeExito}"></div>
            <div th:if="${mensajeError}" class="alert alert-danger m-3" role="alert" th:text="${mensajeError}"></div>

            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle mb-0">
                    <thead class="table-success">
                        <tr>
                            <th>Nombre del Torneo</th>
                            <th>Ciudad</th>
                            <th>Fecha Inicio</th>
                            <th>Fecha Fin</th>
                            <th class="text-end">Selecciona un torneo</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${torneos.isEmpty()}">
                            <td colspan="6" class="text-center p-4">No hay torneos creados.</td>
                        </tr>
                        <tr th:each="torneo : ${torneos}">
                            <td th:text="${torneo.nombre}">Nombre del Torneo</td>
                            <td th:text="${torneo.ciudad}">Ciudad</td>
                            <td th:text="${torneo.fechaInicio}">Fecha Inicio</td>
                            <td th:text="${torneo.fechaFin}">Fecha Fin</td>
                            <td class="text-end">
                                <a th:href="@{/torneos/{id}(id=${torneo.id})}" 
                                   class="btn btn-warning btn-sm me-2 text-dark fw-bold">
                                    <i class="bi bi-people-fill"></i> Seleccionar
                                </a>

                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <th:block th:replace="~{fragments/header :: scripts}"></th:block>
</body>
</html>
