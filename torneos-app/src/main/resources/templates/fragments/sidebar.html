<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<!-- Logo y Botón Activador del Sidebar (Esquina Superior Izquierda) -->
<div th:fragment="sidebar-toggle" class="sidebar-logo-trigger" id="sidebar-logo-trigger" role="button" tabindex="0" title="Menú de navegación" aria-label="Abrir menú de navegación" aria-expanded="false" aria-controls="app-sidebar">
    <div class="sidebar-logo-badge">
        <span class="sidebar-logo-icon">⚽</span>
        <span class="sidebar-logo-brand">SGTF</span>
        <i class="bi bi-list sidebar-hamburger-icon"></i>
    </div>
</div>

<!-- Estructura Completa del Sidebar y Backdrop -->
<div th:fragment="sidebar-drawer">
    <!-- Fondo Oscuro de Superposición -->
    <div id="sidebar-backdrop" class="sidebar-backdrop" aria-hidden="true"></div>

    <!-- Navegación Lateral Desplegable -->
    <aside id="app-sidebar" class="app-sidebar" aria-label="Navegación principal" aria-hidden="true" role="navigation">
        <div class="sidebar-header">
            <div class="sidebar-brand">
                <span class="sidebar-brand-icon">⚽</span>
                <div class="sidebar-brand-text">
                    <span class="sidebar-brand-name">SGTF</span>
                    <small class="sidebar-brand-sub">Gestión de Torneos</small>
                </div>
            </div>
            <button type="button" id="sidebar-close-btn" class="sidebar-close-btn" aria-label="Cerrar menú">
                <i class="bi bi-x-lg"></i>
            </button>
        </div>

        <div class="sidebar-body">
            <nav class="sidebar-nav">
                <div class="sidebar-section-label">MENÚ PRINCIPAL</div>
                <ul class="sidebar-menu">
                    <li class="sidebar-item">
                        <a th:href="@{/index}" class="sidebar-link" data-path="/index">
                            <i class="bi bi-house-door-fill sidebar-icon"></i>
                            <span class="sidebar-text">Inicio</span>
                        </a>
                    </li>
                    <li class="sidebar-item">
                        <a th:href="@{/torneos}" class="sidebar-link" data-path="/torneos">
                            <i class="bi bi-trophy-fill sidebar-icon"></i>
                            <span class="sidebar-text">Torneos</span>
                        </a>
                    </li>
                    <li class="sidebar-item">
                        <a th:href="@{/equipos}" class="sidebar-link" data-path="/equipos">
                            <i class="bi bi-shield-fill sidebar-icon"></i>
                            <span class="sidebar-text">Equipos</span>
                        </a>
                    </li>
                    <li class="sidebar-item">
                        <a th:href="@{/canchas}" class="sidebar-link" data-path="/canchas">
                            <i class="bi bi-pin-map-fill sidebar-icon"></i>
                            <span class="sidebar-text">Canchas</span>
                        </a>
                    </li>
                    <li class="sidebar-item">
                        <a th:href="@{/partidos}" class="sidebar-link" data-path="/partidos">
                            <i class="bi bi-calendar-event-fill sidebar-icon"></i>
                            <span class="sidebar-text">Partidos</span>
                        </a>
                    </li>
                </ul>

                <div class="sidebar-section-label mt-4" sec:authorize="hasAnyAuthority('ADMIN', 'ADMINISTRADOR')">ADMINISTRACIÓN</div>
                <ul class="sidebar-menu" sec:authorize="hasAnyAuthority('ADMIN', 'ADMINISTRADOR')">
                    <li class="sidebar-item">
                        <a th:href="@{/usuarios}" class="sidebar-link" data-path="/usuarios">
                            <i class="bi bi-people-fill sidebar-icon"></i>
                            <span class="sidebar-text">Usuarios</span>
                        </a>
                    </li>
                    <li class="sidebar-item">
                        <a th:href="@{/admin}" class="sidebar-link" data-path="/admin">
                            <i class="bi bi-sliders sidebar-icon"></i>
                            <span class="sidebar-text">Panel Admin</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>

        <div class="sidebar-footer">
            <form th:action="@{/logout}" method="post" class="w-100 m-0">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button type="submit" class="sidebar-link sidebar-logout-btn w-100">
                    <i class="bi bi-box-arrow-left sidebar-icon text-danger"></i>
                    <span class="sidebar-text">Cerrar Sesión</span>
                </button>
            </form>
        </div>
    </aside>
</div>

</body>
</html>
